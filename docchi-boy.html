<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どっちぼーい</title>
<meta name="theme-color" content="#ffd84d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="どっちぼーい">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7e3;
    --dot: #f4e6c2;
    --ink: #2d2a26;
    --sub: #7d7466;
    --card: #ffffff;
    --line: #eadfc6;
    --yellow: #ffd84d;
    --yellow-deep: #f2b705;
    --yes: #43b3ec;
    --yes-soft: #dcf2fd;
    --no: #f26fa6;
    --no-soft: #fde3ee;
    --ok: #2bb673;
    --radius: 14px;
    --shadow: 0 2px 0 rgba(45, 42, 38, .08), 0 6px 18px rgba(45, 42, 38, .06);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Meiryo', system-ui, sans-serif;
    font-weight: 500;
    line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  input, textarea { font: inherit; color: inherit; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 2px solid var(--ink); border-radius: 999px;
    background: var(--card); padding: 10px 18px; font-weight: 800;
    box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.small { padding: 6px 12px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
  .btn.ghost { border-color: transparent; box-shadow: none; background: transparent; text-decoration: underline; padding: 6px 8px; }
  .btn.block { width: 100%; }
  .btn.big { font-size: 18px; padding: 14px 22px; }

  /* ---------- タイトル画面 ---------- */
  .setup { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  .logo { text-align: center; margin: 8px 0 24px; }
  .logo h1 {
    margin: 0; font-size: clamp(40px, 11vw, 64px); font-weight: 800; letter-spacing: .02em; line-height: 1.1;
    color: var(--ink); text-shadow: 3px 3px 0 var(--yellow);
  }
  .logo h1 .y { color: var(--yes); }
  .logo h1 .n { color: var(--no); }
  .logo p { margin: 8px 0 0; color: var(--sub); font-size: 14px; }
  .box {
    background: var(--card); border: 2px solid var(--ink); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 0 var(--ink);
  }
  .box h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .box h2 small { font-weight: 500; color: var(--sub); font-size: 12px; }
  .player-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .player-row .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .player-row input {
    flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fffdf7;
  }
  .player-row input:focus { outline: none; border-color: var(--ink); }
  .icon-btn { border: none; background: none; font-size: 20px; line-height: 1; padding: 6px 8px; color: var(--sub); }
  .set-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .set-row:last-of-type { border-bottom: none; }
  .set-row label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
  .set-row input { width: 20px; height: 20px; accent-color: var(--ink); }
  .set-row .count { color: var(--sub); font-size: 13px; }
  .note { color: var(--sub); font-size: 13px; margin: 8px 0 0; }
  .warn { color: #c0392b; font-size: 13px; margin: 8px 0 0; font-weight: 700; }
  .setup-actions { display: grid; gap: 10px; }

  /* ---------- ゲーム画面 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    max-width: 1320px; margin: 0 auto; padding: 12px 16px 0;
  }
  .topbar .mini-logo { font-weight: 800; font-size: 20px; text-shadow: 2px 2px 0 var(--yellow); }
  .topbar .round { font-size: 13px; font-weight: 700; background: var(--ink); color: #fff; border-radius: 999px; padding: 3px 10px; }
  .topbar .spacer { flex: 1; }
  .wallets { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1320px; margin: 10px auto 0; padding: 0 16px; }
  .wallet {
    display: flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--line);
    border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 13px; font-weight: 700;
  }
  .wallet .av { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .wallet .money { font-variant-numeric: tabular-nums; }
  .wallet.parent { border-color: var(--yellow-deep); background: #fff3c4; }
  .wallet.turn { border-color: var(--ink); }
  .wallet .tag { font-size: 10px; background: var(--yellow-deep); color: #fff; border-radius: 6px; padding: 0 5px; }

  .game {
    display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start;
    max-width: 1320px; margin: 0 auto; padding: 14px 16px 32px;
  }
  @media (max-width: 920px) {
    .game { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  }

  /* 盤面 */
  .board-wrap { background: rgba(255,255,255,.55); border: 2px solid var(--line); border-radius: 18px; padding: clamp(8px, 2vw, 20px); }
  .board {
    position: relative; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
    column-gap: clamp(3px, .9vw, 10px); row-gap: clamp(12px, min(2.4vw, 2.6vh), 24px);
  }
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  .lines .ln { stroke: #d9cdb1; stroke-width: 2; stroke-linecap: round; }
  .lines .ln.on.yes { stroke: var(--yes); stroke-width: 5; }
  .lines .ln.on.no { stroke: var(--no); stroke-width: 5; }
  .start-tag {
    align-self: center; justify-self: start; z-index: 1;
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 8px;
    font-weight: 800; font-size: clamp(10px, 1.5vw, 14px); line-height: 1.2; text-align: center;
  }
  .start-tag small { display: block; font-size: .72em; font-weight: 700; }

  .card {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: stretch; text-align: left;
    min-width: 0; min-height: clamp(62px, min(10.5vw, 11vh), 100px);
    background: var(--card); border: 2px solid var(--line); border-radius: 10px;
    padding: clamp(4px, .8vw, 8px); font-size: clamp(9px, 1.45vw, 14px); line-height: 1.32;
    box-shadow: var(--shadow); transition: transform .15s, border-color .15s, box-shadow .15s, opacity .2s;
  }
  .card .cid { font-weight: 800; font-size: .82em; color: var(--sub); }
  .card .qt {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere; margin-top: 1px;
  }
  .card .mult {
    position: absolute; top: -8px; right: -4px; background: var(--yellow); border: 1.5px solid var(--ink);
    border-radius: 999px; padding: 0 6px; font-size: .78em; font-weight: 800; line-height: 1.5;
  }
  .card.goal {
    align-items: center; justify-content: center; text-align: center; padding: 4px 2px;
    min-height: clamp(54px, min(8vw, 9vh), 80px);
  }
  .card.goal.Y { background: var(--yes-soft); border-color: #a9dcf5; }
  .card.goal.N { background: var(--no-soft); border-color: #f7b8d1; }
  .card.goal .gid { font-weight: 800; font-size: .9em; }
  .card.goal .gm { font-weight: 800; font-size: 1.25em; line-height: 1.1; }
  .card.goal.Y .gm { color: #1584bd; }
  .card.goal.N .gm { color: #d13d7b; }

  .card.visited { opacity: .72; }
  .card.current { border-color: var(--ink); box-shadow: 0 0 0 4px var(--yellow), var(--shadow); transform: translateY(-2px); opacity: 1; }
  .card.reached { border-color: var(--ink); box-shadow: 0 0 0 4px var(--yellow), var(--shadow); opacity: 1; transform: translateY(-2px); }
  .card.dim { opacity: .38; }
  .card.selectable:hover { border-color: var(--ink); }
  .card.pick { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ink), var(--shadow); opacity: 1; }
  .card.info { outline: 2px dashed var(--sub); outline-offset: 2px; }
  .card .stamp {
    position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); z-index: 2;
    font-size: 10px; font-weight: 800; color: #fff; border-radius: 999px; padding: 0 7px; line-height: 1.6;
  }
  .card .stamp.yes { background: var(--yes); }
  .card .stamp.no { background: var(--no); }
  .card .ticket-tag {
    position: absolute; left: -4px; top: -9px; background: var(--ink); color: #fff; border-radius: 999px;
    font-size: .74em; font-weight: 800; padding: 0 6px; line-height: 1.6;
  }
  .koma {
    position: absolute; top: -12px; left: -8px; z-index: 3; width: 26px; height: 26px; border-radius: 50%;
    background: var(--yellow); border: 2px solid var(--ink); display: grid; place-items: center;
    font-size: 12px; font-weight: 800; animation: hop .9s ease-in-out infinite;
  }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .chips { display: flex; flex-wrap: wrap; gap: 2px; margin-top: auto; padding-top: 3px; }
  .card.goal .chips { justify-content: center; margin-top: 2px; }
  .chip {
    width: clamp(13px, 1.9vw, 20px); height: clamp(13px, 1.9vw, 20px); border-radius: 50%; background: var(--c);
    color: #fff; font-size: clamp(8px, 1.1vw, 11px); font-weight: 800; display: grid; place-items: center; line-height: 1;
  }
  .chip.hit { box-shadow: 0 0 0 2px var(--yellow), 0 0 0 3.5px var(--ink); }

  /* パネル */
  .panel {
    background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 16px;
    box-shadow: 0 4px 0 var(--ink); position: sticky; top: 12px;
  }
  @media (max-width: 920px) {
    .panel { position: static; }
    .panel.race { position: sticky; top: auto; bottom: 8px; z-index: 5; }
  }
  .panel h3 { margin: 0 0 6px; font-size: 18px; }
  .panel .lead { margin: 0 0 12px; color: var(--sub); font-size: 14px; }
  .panel .stack { display: grid; gap: 10px; }
  .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
  .who .av { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; }

  .qbox {
    border: 2px solid var(--line); border-radius: 12px; padding: 12px; background: #fffdf7; margin-bottom: 12px;
  }
  .qbox .qid { font-size: 12px; font-weight: 800; color: var(--sub); }
  .qbox .qtext { font-size: 20px; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
  .qbox.small .qtext { font-size: 15px; }
  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .yn .btn { font-size: 22px; padding: 14px 10px; color: #fff; }
  .yn .yes { background: var(--yes); }
  .yn .no { background: var(--no); }
  .progress { display: flex; gap: 4px; margin-bottom: 10px; }
  .progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .progress span.done { background: var(--ink); }

  .tickets { display: grid; gap: 10px; margin-bottom: 12px; }
  .ticket {
    border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; background: #fffdf7; cursor: pointer;
  }
  .ticket.active { border: 2px solid var(--ink); background: #fff8d6; }
  .ticket .t-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 13px; }
  .ticket .t-target { font-size: 16px; font-weight: 800; margin: 4px 0 8px; }
  .ticket .t-target.empty { color: var(--sub); font-weight: 700; font-size: 14px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    border: 2px solid var(--ink); background: var(--card); border-radius: 8px; min-width: 40px; padding: 4px 6px; font-weight: 800; font-size: 13px;
  }
  .stepper .amt { flex: 1; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stepper .amt small { font-size: 11px; color: var(--sub); }
  .pick-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .pick-list button {
    border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-weight: 800;
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
  }
  .pick-list button .av { width: 16px; height: 16px; border-radius: 50%; background: var(--c); }
  .pick-list button.on { border-color: var(--ink); background: var(--yellow); }
  .bet-sum { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 10px; }

  .bets-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .bets-list li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .bets-list .tk { background: #f6f0e1; border-radius: 6px; padding: 0 6px; font-weight: 700; }
  .bets-list .tk.hit { background: var(--yellow); }
  details.more { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  details.more summary { cursor: pointer; font-weight: 800; font-size: 14px; }
  details.more[open] summary { margin-bottom: 8px; }

  .table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 12px; }
  .table th, .table td { padding: 7px 4px; border-bottom: 1px dashed var(--line); text-align: left; }
  .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table .plus { color: var(--ok); font-weight: 800; }
  .rank { font-size: 22px; width: 36px; }
  .goal-banner {
    text-align: center; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-weight: 800; border: 2px solid var(--ink);
  }
  .goal-banner.Y { background: var(--yes-soft); }
  .goal-banner.N { background: var(--no-soft); }
  .goal-banner .big { font-size: 26px; display: block; }

  /* モーダル */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(45, 42, 38, .45); z-index: 50; display: grid; place-items: center; padding: 16px;
  }
  .modal {
    background: var(--card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
    width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px;
  }
  .modal h2 { margin: 0 0 12px; font-size: 20px; }
  .modal h4 { margin: 16px 0 4px; }
  .modal p, .modal li { font-size: 14px; }
  .modal ol, .modal ul { padding-left: 20px; margin: 4px 0; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
  .tabs button.on { border-color: var(--ink); background: var(--yellow); }
  .ed-name { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .ed-text {
    width: 100%; min-height: 260px; border: 2px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical;
    font-size: 14px; line-height: 1.6; background: #fffdf7;
  }
  .ed-text:focus, .ed-name:focus { outline: none; border-color: var(--ink); }
  .ed-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .file-btn input { display: none; }

  /* トースト */
  #toasts { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
  .toast {
    background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.2); animation: pop .25s ease-out; transition: opacity .3s, transform .3s;
  }
  .toast.hit { background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); }
  .toast.out { opacity: 0; transform: translateY(-8px); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';

// ===== 定数 =====
const DEFAULT_SETS = [
 {
  "id": "normal",
  "name": "ノーマル",
  "questions": [
   "透明人間になれるとしたら、なってみたい",
   "過去に戻れるとしても、今の人生を変えたくない",
   "タイムマシンがあったら、未来より過去に行ってみたい",
   "不老不死になれるとしたら、なりたいと思う",
   "ひとつだけ魔法が使えるなら、使ってみたい",
   "動物と話せる能力がほしい",
   "生まれ変わるなら、今とは違う性別がいい",
   "宝くじで高額当選したら、今の仕事は辞める",
   "人の心を読める能力は、欲しいと思わない",
   "無人島に一つだけ持っていくなら、スマホを選ぶ",
   "スマホの画面は常に綺麗にしておきたい",
   "本は電子書籍より紙で読みたい",
   "食べ物の好き嫌いはほとんどない",
   "洋服のタグは切らないと気になる",
   "自分の部屋は、ある程度整頓されていないと落ち着かない",
   "人におすすめされたものは、とりあえず試してみる方だ",
   "日記やブログなど、何かを記録する習慣がある",
   "「限定品」という言葉に弱い",
   "自分の「ラッキーナンバー」がある",
   "人にどう思われるかより、自分のスタイルを貫きたい",
   "どちらかといえば、節約は得意な方だ",
   "ポイントカードやクーポンは積極的に利用する",
   "友人との食事では、きっちり割り勘にしたい",
   "自分へのご褒美として、高価なものを買うことがある",
   "お金は「使う」ためにあると思う",
   "自動販売機より、スーパーで飲み物を買うことが多い",
   "趣味にかけるお金は惜しまない",
   "人にお金を貸すことに抵抗がある",
   "将来のために、貯金や投資をしている",
   "恋愛において、見た目はかなり重要だと思う",
   "好きな人には、自分から積極的にアピールしたい",
   "遠距離恋愛はできないと思う",
   "恋人やパートナーとは、毎日連絡を取りたい",
   "一度冷めた気持ちは、もう戻らない",
   "友達の数は多い方だと思う",
   "嫌いな人とも、うまく付き合っていくことができる",
   "約束を破られると、かなり根に持つタイプだ",
   "一人の時間がないとダメになる",
   "知らない場所に行くときは、地図アプリが手放せない",
   "映画は、ハッピーエンドの物語が好きだ",
   "行列に並んでまで食べたいと思うものはあまりない",
   "季節の変わり目は、少しだけ切ない気持ちになる",
   "手紙やハガキなど、手書きのメッセージをもらうと嬉しい",
   "新しいことを始めるのに、あまり抵抗はない方だ",
   "ジェットコースターは、好き好んで乗る方ではない",
   "SNSは、見る専門で自分から発信することは少ない",
   "サプライズは、するのもされるのも好きだ",
   "悩み事は、信頼できる人にだけ相談したい",
   "喧嘩をしても、次の日には忘れていることが多い",
   "「ありがとう」と「ごめんなさい」は、すぐに言うようにしている",
   "完璧を目指すよりも、まずは行動することが大事だと思う",
   "運命や占いは、良いことだけを信じるようにしている",
   "一度始めたことは、最後までやり遂げたい",

const START_BONUS = 100;      // ラウンド開始時に全員がもらえるドッチ
const MIN_BET = 10;
const PARENT_MULT = 2;        // 親の予想が当たったときの倍率
const ROW_MULT = [0, 0, 2, 3, 4];
const ROW_NAMES = ['', '', '知人の段', '友達の段', '親友の段'];
const GOAL_MULT = [16, 12, 8, 12, 16];
const COLORS = ['#e8506b', '#3a86ff', '#20b2a0', '#ff9416', '#8e5cf7', '#6a994e'];
const LS_SETS = 'docchi-boy:sets:v1';
const LS_GAME = 'docchi-boy:game:v1';
const LS_NAMES = 'docchi-boy:names:v1';

// 盤面のマスID: 質問は q{段}{列}（0始まり）、ソウルメイトの段は Y1〜Y5 / N1〜N5
const QIDS = [];
for (let r = 0; r < 5; r++) for (let c = 0; c <= r; c++) QIDS.push(`q${r}${c}`);

// ===== ユーティリティ =====
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const parseLines = text => [...new Set(String(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean))];
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 保存できない環境でも遊べる */ } },
  del(key) { try { localStorage.removeItem(key); } catch { /* noop */ } },
};

const isGoal = id => id[0] !== 'q';
const rowOf = id => +id[1];
const label = id => isGoal(id) ? `${id[0]}-${id.slice(1)}` : `${'ABCDE'[rowOf(id)]}-${+id[2] + 1}`;
const multOf = id => isGoal(id) ? GOAL_MULT[+id.slice(1) - 1] : ROW_MULT[rowOf(id)];
const rowName = id => isGoal(id) ? 'ソウルメイトの段' : ROW_NAMES[rowOf(id)];
const isBettable = id => multOf(id) > 0;
// 公式どおり YES は左下、NO は右下へ
function nextOf(id, ans) {
  const r = rowOf(id), c = +id[2];
  if (r < 4) return `q${r + 1}${ans === 'yes' ? c : c + 1}`;
  return `${ans === 'yes' ? 'Y' : 'N'}${c + 1}`;
}

// ===== 質問セット =====
function loadSets() {
  const base = DEFAULT_SETS.map(d => ({ id: d.id, name: d.name, builtin: true, questions: [...d.questions], enabled: d.id === 'normal' }));
  const saved = store.get(LS_SETS);
  if (!Array.isArray(saved)) return base;
  const out = saved
    .filter(s => s && Array.isArray(s.questions))
    .map(s => ({
      id: String(s.id), name: String(s.name || '名前なし'), builtin: DEFAULT_SETS.some(d => d.id === s.id),
      questions: s.questions.map(String), enabled: !!s.enabled,
    }));
  base.slice().reverse().forEach(b => { if (!out.some(s => s.id === b.id)) out.unshift(b); });
  return out;
}
let sets = loadSets();
const saveSets = () => store.set(LS_SETS, sets);
const enabledPool = () => parseLines(sets.filter(s => s.enabled).flatMap(s => s.questions).join('\n'));

let S = null;          // 進行中のゲーム
let undoStack = [];    // 出走中の「1つ戻す」用
let infoId = null;     // タップして詳細表示中のマス
let pending = null;    // 入力中のドッチ券
let activeTicket = 0;
let editorSetId = null;
let confirmAction = null;

const saveGame = () => { if (S) store.set(LS_GAME, S); };
const parentIdx = () => S.round;
const childIdxs = () => S.players.map((_, i) => i).filter(i => i !== parentIdx());
const bettor = () => S.order[S.cursor];

// ===== ゲーム進行 =====
function newGame(names, pool) {
  S = {
    phase: 'intro',
    players: names.map((name, i) => ({ name, money: 0, color: COLORS[i] })),
    round: 0, pool, deck: shuffle(pool), board: [],
    bets: {}, order: [], cursor: 0, path: [], pos: 'q00', gains: [],
  };
  beginRound();
}

function beginRound() {
  const n = S.players.length, p = parentIdx();
  S.players.forEach(pl => { pl.money += START_BONUS; });
  drawBoard();
  S.bets = {};
  S.order = [...Array(n - 1)].map((_, k) => (p + 1 + k) % n).concat(p); // 親の左隣から、親は最後
  S.cursor = 0;
  S.path = [];
  S.pos = 'q00';
  S.gains = S.players.map(() => 0);
  S.phase = 'intro';
  undoStack = [];
  infoId = null;
}

function drawBoard() {
  if (S.deck.length < QIDS.length) {
    const onBoard = new Set(S.board);
    S.deck = shuffle(S.pool.filter(q => !onBoard.has(q)));
    if (S.deck.length < QIDS.length) S.deck = shuffle(S.pool);
  }
  S.board = S.deck.splice(0, QIDS.length);
}

function startBetting() {
  pending = [{ target: null, amount: MIN_BET }, { target: null, amount: MIN_BET }];
  activeTicket = 0;
  infoId = null;
  S.phase = 'bet';
}

function betProblem() {
  const me = S.players[bettor()];
  const [a, b] = pending;
  if (a.target === null || b.target === null) return bettor() === parentIdx() ? '2枚とも当てそうな子を選んでね' : '2枚とも賭けるマスを選んでね';
  if (a.target === b.target) return '2枚とも同じ対象には賭けられません';
  if (a.amount + b.amount > me.money) return '所持金が足りません';
  return null;
}

function confirmBet() {
  if (betProblem()) return;
  const i = bettor();
  S.players[i].money -= pending[0].amount + pending[1].amount;
  S.bets[i] = pending.map(t => ({ target: t.target, amount: t.amount, hit: false }));
  pending = null;
  infoId = null;
  S.cursor++;
  S.phase = S.cursor >= S.order.length ? 'race' : 'handoff';
}

function answer(ans) {
  undoStack.push(JSON.stringify(S));
  const from = S.pos, to = nextOf(from, ans);
  S.path.push({ from, to, ans });
  S.pos = to;
  infoId = null;
  resolveHits(to);
  if (isGoal(to)) S.phase = 'result';
}

function credit(i, amount) {
  S.players[i].money += amount;
  S.gains[i] += amount;
}

function resolveHits(id) {
  const m = multOf(id);
  if (!m) return;
  const p = parentIdx();
  for (const i of childIdxs()) {
    for (const t of S.bets[i] || []) {
      if (t.target !== id) continue;
      t.hit = true;
      credit(i, t.amount * m);
      toast(`🎉 <b>${esc(S.players[i].name)}</b> が ${label(id)} 的中！ +${t.amount * m}`, 'hit');
      for (const pt of S.bets[p] || []) {
        if (pt.target === i && !pt.hit) {
          pt.hit = true;
          credit(p, pt.amount * PARENT_MULT);
          toast(`👑 親の <b>${esc(S.players[p].name)}</b> も読み的中！ +${pt.amount * PARENT_MULT}`, 'hit');
        }
      }
    }
  }
}

function undo() {
  if (!undoStack.length) return;
  S = JSON.parse(undoStack.pop());
  infoId = null;
}

function nextRound() {
  S.round++;
  if (S.round >= S.players.length) S.phase = 'final';
  else beginRound();
}

  if (!S) renderSetup();
  else renderGame();
}

      <p class="warn" id="setup-problem" ${problem ? '' : 'hidden'}>${problem ? esc(problem) : ''}</p>

}

function walletsHTML() {
  const p = parentIdx();
  const turn = S.phase === 'bet' || S.phase === 'handoff' ? bettor() : -1;
  return `<div class="wallets">${S.players.map((pl, i) => `
    <div class="wallet ${i === p ? 'parent' : ''} ${i === turn ? 'turn' : ''}" style="--c:${pl.color}">
      <span class="av">${esc([...pl.name][0])}</span>${esc(pl.name)}

}

function renderGame() {
  const total = S.players.length;
  const roundText = S.phase === 'final' ? '結果発表' : `ラウンド ${S.round + 1} / ${total}`;
  $('#app').innerHTML = `
    <header class="topbar">

function boardHTML() {
  const showBets = ['race', 'result'].includes(S.phase);
  const visited = new Map(S.path.map(p => [p.from, p.ans]));
  const picks = S.phase === 'bet' && bettor() !== parentIdx() ? pending.map(t => t.target) : [];
  const chipsFor = id => {
    if (!showBets) return '';
    const chips = [];
    for (const i of childIdxs()) {
      for (const t of S.bets[i] || []) {
        if (t.target === id) chips.push(`<span class="chip ${t.hit ? 'hit' : ''}" style="--c:${S.players[i].color}" title="${esc(S.players[i].name)} ${t.amount}">${esc([...S.players[i].name][0])}</span>`);
      }
    }
    return chips.length ? `<span class="chips">${chips.join('')}</span>` : '';
  };
  const cls = id => {
    const c = [];
    if (S.phase === 'bet' && bettor() !== parentIdx()) c.push(isBettable(id) ? 'selectable' : 'dim');
    if (visited.has(id)) c.push('visited');
    if (S.phase === 'race' && S.pos === id) c.push('current');
    if (['result', 'final'].includes(S.phase) && S.pos === id) c.push('reached');
    if (picks.includes(id)) c.push('pick');
    if (infoId === id) c.push('info');
    return c.join(' ');
  };
  const extras = id => {
    let h = '';
    const k = picks.indexOf(id);
    if (k >= 0) h += `<span class="ticket-tag">券${k + 1}</span>`;
    if (visited.has(id)) h += `<span class="stamp ${visited.get(id)}">${visited.get(id) === 'yes' ? 'YES' : 'NO'}</span>`;
    if (S.pos === id && S.phase !== 'intro' && S.phase !== 'handoff' && S.phase !== 'bet') h += `<span class="koma">親</span>`;
    return h + chipsFor(id);
  };

  let h = `<div class="board" id="board"><svg class="lines" id="lines" aria-hidden="true"></svg>`;
  h += `<div class="start-tag" style="grid-column:1 / span 3;grid-row:1">START<small>全員に+${START_BONUS}</small></div>`;
  QIDS.forEach((id, k) => {
    const r = rowOf(id), c = +id[2], m = multOf(id);
    h += `<button class="card q ${cls(id)}" data-act="card" data-id="${id}" style="grid-column:${4 - r + 2 * c + 1} / span 2;grid-row:${r + 1}">
      <span class="cid">${label(id)}</span>${m ? `<span class="mult">×${m}</span>` : ''}
      <span class="qt">${esc(S.board[k])}</span>${extras(id)}
    </button>`;
  });
  for (let c = 1; c <= 5; c++) {
    for (const yn of ['Y', 'N']) {
      const id = yn + c;
      h += `<button class="card goal ${yn} ${cls(id)}" data-act="card" data-id="${id}" style="grid-column:${(c - 1) * 2 + (yn === 'Y' ? 1 : 2)};grid-row:6">
        <span class="gid">${label(id)}</span><span class="gm">×${multOf(id)}</span>${extras(id)}
      </button>`;
    }
  }
  return h + `</div>`;
}

function whoHTML(i) {

function infoHTML() {

function betsListHTML() {

            <td>${whoHTML(i)}${i === p ? ' <small>(親)</small>' : ''}</td>

        </div>
      </aside>`;
    }
  }
  return '';
}

// ===== 盤面の線 =====
let boardObserver = null;
function observeBoard() {
  if (boardObserver) boardObserver.disconnect();
  const board = $('#board');
  if (!board) return;
  boardObserver = new ResizeObserver(drawLines);
  boardObserver.observe(board);
  drawLines();
}

function drawLines() {
  const board = $('#board'), svg = $('#lines');
  if (!board || !svg) return;
  const b = board.getBoundingClientRect();
  const box = id => {
    const r = board.querySelector(`[data-id="${id}"]`).getBoundingClientRect();
    return { x: r.left - b.left, y: r.top - b.top, w: r.width, h: r.height };
  };
  const taken = new Map(S.path.map(p => [p.from, p.ans]));
  const base = [], onPath = []; // 通った道は後から描いて上に重ねる
  for (const id of QIDS) {
    const a = box(id);
    for (const ans of ['yes', 'no']) {
      const t = box(nextOf(id, ans));
      const x1 = a.x + a.w * (ans === 'yes' ? .3 : .7), y1 = a.y + a.h;
      const x2 = t.x + t.w / 2, y2 = t.y;
      const on = taken.get(id) === ans;
      (on ? onPath : base).push(`<line class="ln ${ans} ${on ? 'on' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
    }
  }
  svg.setAttribute('viewBox', `0 0 ${b.width} ${b.height}`);
  svg.innerHTML = base.join('') + onPath.join('');
}

// ===== トースト・モーダル =====
function toast(html, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = html;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3000);
}

// ===== イベント =====
const actions = {
  'add-player'() { if (draftNames.length < 6) { draftNames.push(''); store.set(LS_NAMES, draftNames); render(); } },
  'del-player'(el) { draftNames.splice(+el.dataset.i, 1); store.set(LS_NAMES, draftNames); render(); },
  start() {
    const names = draftNames.map(s => s.trim()).filter(Boolean);
    newGame(names, shuffle(enabledPool()));
    store.set(LS_NAMES, draftNames);
  },
  resume() {
    S = store.get(LS_GAME);
    if (S && S.phase === 'bet') S.phase = 'handoff'; // 入力途中の券は保存していない
    undoStack = [];
  },
  rules() { openRules(); return false; },
  'open-editor'() { openEditor(); return false; },
  'to-title'() { S = null; pending = null; undoStack = []; },
  again() {
    const names = S.players.map(p => p.name), pool = S.pool;
    newGame(names, pool);
  },
  'to-handoff'() { S.phase = 'handoff'; infoId = null; },
  redraw() { drawBoard(); infoId = null; },
  'to-bet'() { startBetting(); },
  card(el) {
    const id = el.dataset.id;
    if (S.phase === 'bet' && bettor() !== parentIdx()) {
      if (!isBettable(id)) { infoId = id; toast('1・2段目には賭けられません'); return; }
      const other = pending[1 - activeTicket];
      if (other.target === id) { toast('2枚とも同じマスには賭けられません'); return; }
      pending[activeTicket].target = id;
      infoId = id;
      if (other.target === null) activeTicket = 1 - activeTicket;
      return;
    }
    infoId = infoId === id ? null : id;
  },
  ticket(el) { activeTicket = +el.dataset.k; },
  ppick(el) {
    const k = +el.dataset.k;
    pending[k].target = +el.dataset.i;
    activeTicket = k;
    if (pending[1 - k].target === null) activeTicket = 1 - k;
  },
  amt(el) {
    const k = +el.dataset.k, t = pending[k];
    const max = S.players[bettor()].money - pending[1 - k].amount;
    t.amount = Math.max(MIN_BET, Math.min(max, t.amount + +el.dataset.d));
    activeTicket = k;
  },
  'amt-max'(el) {
    const k = +el.dataset.k;
    pending[k].amount = Math.max(MIN_BET, S.players[bettor()].money - pending[1 - k].amount);
    activeTicket = k;
  },
  'confirm-bet'() { confirmBet(); },
  answer(el) { answer(el.dataset.ans); },
  undo() { undo(); },
  'next-round'() { nextRound(); },
  'close-modal'() { closeModal(); return false; },
  'modal-bg'(el, e) { if (e.target === el) closeModal(); return false; },
  'confirm-ok'() { const fn = confirmAction; confirmAction = null; closeModal(); if (fn) fn(); return false; },
  'ed-tab'(el) { openEditor(el.dataset.id); return false; },
  'ed-new'() {
    const set = { id: 'c' + Date.now(), name: '新しいセット', builtin: false, questions: [], enabled: false };
    sets.push(set); saveSets(); openEditor(set.id); return false;
  },
  'ed-export'() {
    const set = sets.find(s => s.id === editorSetId);
    const url = URL.createObjectURL(new Blob([set.questions.join('\n') + '\n'], { type: 'text/plain' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `${set.name}.txt` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return false;
  },
  'ed-reset'() {
    const set = sets.find(s => s.id === editorSetId);
    askConfirm(`「${esc(set.name)}」を最初の質問に戻します。`, '戻す', () => {
      set.questions = [...DEFAULT_SETS.find(d => d.id === set.id).questions];
      saveSets(); openEditor(set.id);
    });
    return false;
  },
  'ed-delete'() {
    const set = sets.find(s => s.id === editorSetId);
    askConfirm(`「${esc(set.name)}」を削除します。`, '削除する', () => {
      sets = sets.filter(s => s.id !== set.id);
      saveSets(); editorSetId = sets[0].id; openEditor();
    });
    return false;
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (fn(el, e) === false) return; // モーダル系は画面を描き直さない
  saveGame();
  render();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name !== undefined) {
    draftNames[+t.dataset.name] = t.value;
    store.set(LS_NAMES, draftNames);
    // 入力欄のフォーカスを保つため、スタートボタンと警告だけ更新する
    const names = draftNames.map(s => s.trim()).filter(Boolean);
    const pool = enabledPool();
    const problem = names.length < 3 ? 'プレイヤーは3人以上必要です'
      : new Set(names).size !== names.length ? '同じ名前のプレイヤーがいます'
      : pool.length < QIDS.length ? `質問が${QIDS.length}個以上必要です（今は${pool.length}個）` : null;
    $('[data-act="start"]').disabled = !!problem;
    const warn = $('#setup-problem');
    warn.hidden = !problem;
    warn.textContent = problem || '';
  } else if (t.id === 'ed-text') {
    const set = sets.find(s => s.id === editorSetId);
    set.questions = parseLines(t.value);
    saveSets(); updateEditorCount();
  } else if (t.id === 'ed-name') {
    const set = sets.find(s => s.id === editorSetId);
    set.name = t.value.trim() || '名前なし';
    saveSets();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set !== undefined) {
    const set = sets.find(s => s.id === t.dataset.set);
    set.enabled = t.checked;
    saveSets(); render();
  } else if (t.id === 'ed-file' && t.files[0]) {
    const file = t.files[0];
    file.text().then(text => {
      const set = { id: 'c' + Date.now(), name: file.name.replace(/\.[^.]+$/, '').slice(0, 20) || '読み込んだ質問', builtin: false, questions: parseLines(text), enabled: true };
      sets.push(set); saveSets(); openEditor(set.id);
      toast(`「${esc(set.name)}」を${set.questions.length}問で追加しました`);
    });
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
});

render();

// Web で公開しているときだけ、オフライン起動用の Service Worker を登録する
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => { /* 登録できなくても遊べる */ });
}
</script>
</body>
</html>
